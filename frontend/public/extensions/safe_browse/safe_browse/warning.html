<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Warning: Dangerous Site</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #b91c1c;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 24px; }
    #targetUrl {
      word-break: break-all;
      background: rgba(0,0,0,0.2);
      padding: 8px 14px;
      border-radius: 6px;
      max-width: 500px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    #proceed { background: #7f1d1d; color: white; }
    #proceed:disabled { opacity: 0.5; cursor: not-allowed; }
    #back { background: white; color: #b91c1c; font-weight: bold; }
    #homeSite { background: #1e3a8a; color: white; }
    .divider { width: 80%; max-width: 400px; height: 1px; background: rgba(255,255,255,0.3); margin: 16px 0; }
  </style>
</head>
<body>
  <h1>⚠️ Warning: Dangerous Site Ahead</h1>
  <p id="targetUrl"></p>
  <p>This site has been flagged as potentially malicious or matches patterns commonly used in phishing attacks.</p>
  <button id="back">Go Back to Safety</button>
  <button id="proceed" disabled>Proceed Anyway (10)</button>
  <div class="divider"></div>
  <button id="homeSite">Take Me to [Your Site Name]</button>
  <script src="warning.js"></script>
</body>
</html>
